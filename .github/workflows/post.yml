name: kitano-ig-post

# 北野工作所 Instagram に posts/ の次の1本を投稿する。
# 起動は claude.ai の定期ルーティン(朝7:00/昼12:30/夜20:00)から workflow_dispatch で行う。
# schedule は予備: ルーティンが失敗した日だけ投稿する(今日のその時間帯が投稿済みなら何もしない。
# GitHub の遅延で時間外に動いたときも何もしない → 深夜に投稿されることはない)。
on:
  schedule:
    - cron: "30 0 * * *"    # 9:30 JST 朝の予備
    - cron: "30 5 * * *"    # 14:30 JST 昼の予備
    - cron: "0 13 * * *"    # 22:00 JST 夜の予備
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず次の1本を表示するだけなら true"
        required: false
        default: "false"
      slug:
        description: "この番号のネタを今すぐ投稿(例 03_kawara。通常は空)"
        required: false
        default: ""

concurrency:
  group: kitano-ig-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: マイビジネス用の横長画像(gbp_img/)が足りなければ作って push(API が公開URLで取りに来るため先に公開)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python gbp_export.py --images
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gbp_img
          if ! git diff --cached --quiet; then
            git commit -m "マイビジネス用画像を追加 [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Instagram に投稿(＋マイビジネス用を Google ドライブへ保存＋マイビジネスへ API 投稿)
        env:
          KITANO_IG_USER_ID: ${{ secrets.KITANO_IG_USER_ID }}
          KITANO_IG_ACCESS_TOKEN: ${{ secrets.KITANO_IG_ACCESS_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--backup"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"; fi
          python post_ig.py $ARGS
      - name: state.json を書き戻す
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state [skip ci]"
          git pull --rebase origin main
          git push
